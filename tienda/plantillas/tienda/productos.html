{% extends 'tienda/base.html' %}

{% block contenido %}
    <h2>Lista de Productos</h2>
    
    <div style="margin-bottom: 20px;">
        <a href="{% url 'agregar_producto' %}" class="btn">Agregar Nuevo Producto</a>
        <a href="{% url 'buscar_producto' %}" class="btn" style="background-color: #6c757d;">Buscar Producto</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 15px;">
    {% for producto in productos %}
        <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; width: 200px;">
            <h4 style="margin: 0;">{{ producto.nombre }}</h4>
            <p style="color: #28a745; font-weight: bold; font-size: 1.2em;">${{ producto.precio }}</p>
        </div>
    {% empty %}
        <div class="alert">Todavía no hay productos agregados.</div>
    {% endfor %}
    </div>
{% endblock %}
