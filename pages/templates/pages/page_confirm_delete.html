{% extends 'tienda/base.html' %}

{% block contenido %}
    <h2>Borrar Blog</h2>
    <p>¿Estás seguro de que deseas borrar el blog "{{ object.title }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #dc3545;">Sí, Borrar</button>
        <a href="{% url 'pages_detail' object.id %}" class="btn" style="background-color: gray;">Cancelar</a>
    </form>
{% endblock %}
